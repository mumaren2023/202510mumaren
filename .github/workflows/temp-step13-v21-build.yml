name: TEMP Step13 V2.1 Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --force-reinstall \
            python-docx openpyxl attrs rpds-py \
            referencing==0.36.2 jsonschema-specifications==2025.4.1 jsonschema==4.25.1
          python - <<'PY'
          import inspect, jsonschema, referencing
          from jsonschema import Draft202012Validator
          print('jsonschema', jsonschema.__version__ if hasattr(jsonschema,'__version__') else jsonschema)
          print('validator_signature', inspect.signature(Draft202012Validator))
          print('referencing', referencing.__file__)
          PY
      - name: Build and validate V2.1 candidate
        id: build
        shell: bash
        run: |
          set -uo pipefail
          SOURCE_URL='https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-f4f8-8206-94c8-ad9e3b633f54/raw?se=2026-07-22T12:29:32Z&sp=r&sv=2026-02-06&sr=b&scid=26769799-1a72-59c2-b56a-ac33c66ccab9&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-21T22:12:58Z&ske=2026-07-23T22:12:58Z&sks=b&skv=2026-02-06&sig=eiFrcYRjo8xsV9XpddlaqDC6bualDMH2SfqCzh/yTcw%3D'
          {
            set -x
            curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/v20-source.zip
            file /tmp/v20-source.zip
            unzip -t /tmp/v20-source.zip >/tmp/unzip-test.txt
            tail -n 4 /tmp/unzip-test.txt
            python tools/temp_step13_v21_repair.py \
              --source-url "$SOURCE_URL" \
              --output-dir /tmp/step13-v21-output
            find /tmp/step13-v21-output -maxdepth 1 -type f -printf '%f\n' | sort
            cat /tmp/step13-v21-output/build_result.json
          } > /tmp/build.log 2>&1
          STATUS=$?
          tail -n 180 /tmp/build.log
          exit $STATUS
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step13-v21-build-diagnostics
          path: /tmp/build.log
          if-no-files-found: error
          retention-days: 3
      - name: Upload V2.1 candidate artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: step13-v21-candidate
          path: /tmp/step13-v21-output/*
          if-no-files-found: error
          retention-days: 3
