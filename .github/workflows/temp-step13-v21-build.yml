name: TEMP Step13 V2.1 Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Print compact V2.1 metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/result
          gh run download 29920187221 --repo mumaren2023/202510mumaren --name step13-v21-build-diagnostics --dir /tmp/result
          python - <<'PY'
          from pathlib import Path
          import json
          text=Path('/tmp/result/build.log').read_text(encoding='utf-8',errors='replace')
          marker='"complete_sha256"'
          pos=text.rfind(marker)
          start=text.rfind('{',0,pos)
          depth=0; end=None
          for i in range(start,len(text)):
              if text[i]=='{': depth+=1
              elif text[i]=='}':
                  depth-=1
                  if depth==0:
                      end=i+1; break
          data=json.loads(text[start:end])
          compact={k:data.get(k) for k in ['complete_zip','complete_sha256','v20_regression','v21_tests','manifest_entries','history_v20_files','outputs']}
          print(json.dumps(compact,ensure_ascii=False,indent=2))
          PY
