name: TEMP Step13 V2.1 Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe OneDrive source link
        shell: bash
        run: |
          set -u
          URL='https://1drv.ms/w/s!ACvrbSoGybQogS8?download=1'
          CODE=$(curl -L -sS -D /tmp/headers.txt -w '%{http_code}' "$URL" -o /tmp/source.bin || true)
          echo "HTTP_CODE=$CODE"
          cat /tmp/headers.txt || true
          ls -lh /tmp/source.bin || true
          file /tmp/source.bin || true
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/source.bin')
          print('EXISTS',p.exists(),'SIZE',p.stat().st_size if p.exists() else None)
          print('HEAD',p.read_bytes()[:64] if p.exists() else None)
          PY
          test -s /tmp/source.bin
