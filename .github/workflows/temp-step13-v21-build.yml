name: TEMP Step13 V2.1 Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Read successful build result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/result
          gh run download 29920187221 --repo mumaren2023/202510mumaren --name step13-v21-build-diagnostics --dir /tmp/result
          echo '--- FINAL RESULT LINES ---'
          grep -nE 'complete_sha256|complete_zip|v20_regression|v21_tests|manifest_entries|history_v20_files|output_dir|outputs' /tmp/result/build.log || true
          echo '--- FINAL 100 LINES ---'
          tail -n 100 /tmp/result/build.log
          echo '--- END ---'
