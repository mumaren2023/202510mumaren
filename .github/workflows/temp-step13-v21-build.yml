name: TEMP Step13 V2.1 Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check python-docx openpyxl jsonschema
      - name: Build and validate V2.1 candidate
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE_URL='https://1drv.ms/w/s!ACvrbSoGybQogS8?download=1'
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/v20-source.zip
          file /tmp/v20-source.zip
          unzip -t /tmp/v20-source.zip >/tmp/unzip-test.txt
          tail -n 5 /tmp/unzip-test.txt
          python tools/temp_step13_v21_repair.py \
            --source-url "$SOURCE_URL" \
            --output-dir /tmp/step13-v21-output
          find /tmp/step13-v21-output -maxdepth 1 -type f -printf '%f\n' | sort
          cat /tmp/step13-v21-output/build_result.json
      - name: Upload V2.1 candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: step13-v21-candidate
          path: /tmp/step13-v21-output/*
          if-no-files-found: error
          retention-days: 3
