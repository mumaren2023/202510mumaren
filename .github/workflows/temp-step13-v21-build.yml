name: TEMP Step13 V2.1 Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Read build diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/diag
          gh run download 29918460814 --repo mumaren2023/202510mumaren --name step13-v21-build-diagnostics --dir /tmp/diag
          echo '--- BUILD DIAGNOSTIC ---'
          cat /tmp/diag/build.log
          echo '--- END DIAGNOSTIC ---'
