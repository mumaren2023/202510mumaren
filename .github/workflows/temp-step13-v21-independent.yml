name: temp-step13-v21-independent
on:
  push:
    branches:
      - temp-step13-v21-independent-20260722
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download source immediately
        env:
          SOURCE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-2800-8206-8784-01c9a6926b2b/raw?se=2026-07-22T13:19:04Z&sp=r&sv=2026-02-06&sr=b&scid=b76d08e2-434b-59d2-9651-29625b8e2045&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-21T21:35:33Z&ske=2026-07-23T21:35:33Z&sks=b&skv=2026-02-06&sig=JPQpX4J76iQ0OhZiLs%2B6hifYtmfTtwQUnlGimNX2T1Q%3D"
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" --output "$RUNNER_TEMP/step13-v21-source.zip"
          test -s "$RUNNER_TEMP/step13-v21-source.zip"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: pip install -q jsonschema python-docx openpyxl
      - name: Run audit and print concise error
        continue-on-error: true
        run: |
          set +e
          python tools/temp_step13_v21_independent_audit.py \
            --source-url "file://$RUNNER_TEMP/step13-v21-source.zip" \
            --output-dir "$RUNNER_TEMP/step13-v21-independent-output" \
            > "$RUNNER_TEMP/independent-audit.log" 2>&1
          code=$?
          echo "$code" > "$RUNNER_TEMP/independent-audit-exit-code.txt"
          echo '--- AUDIT LOG TAIL ---'
          tail -n 120 "$RUNNER_TEMP/independent-audit.log"
          exit 0
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step13-v21-independent-audit
          path: |
            ${{ runner.temp }}/step13-v21-independent-output/**
            ${{ runner.temp }}/step13_v21_independent_audit_artifact.zip
            ${{ runner.temp }}/independent-audit.log
            ${{ runner.temp }}/independent-audit-exit-code.txt
          if-no-files-found: warn
          retention-days: 3
