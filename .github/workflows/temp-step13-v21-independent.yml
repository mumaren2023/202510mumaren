name: temp-step13-v21-independent
on:
  push:
    branches:
      - temp-step13-v21-independent-20260722
  pull_request:
    branches:
      - main
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download source immediately
        env:
          SOURCE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-dc18-8206-80a7-5728717eeffe/raw?se=2026-07-22T13:23:02Z&sp=r&sv=2026-02-06&sr=b&scid=e7864ed3-ce73-56ce-8600-997e9a13bd99&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-22T11:27:53Z&ske=2026-07-24T11:27:53Z&sks=b&skv=2026-02-06&sig=OYsBaLNUm1kUSOAZjsR0td43INQtiwmlcI3mvFgVIds%3D"
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" --output "$RUNNER_TEMP/step13-v21-source.zip"
          test -s "$RUNNER_TEMP/step13-v21-source.zip"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: pip install -q jsonschema
      - name: Diagnose V2.0 history regression
        run: |
          python tools/temp_step13_v20_history_diagnose.py \
            --source-zip "$RUNNER_TEMP/step13-v21-source.zip" \
            --output "$RUNNER_TEMP/v20-history-diagnosis" \
            > "$RUNNER_TEMP/v20-history-diagnosis.log" 2>&1
          cat "$RUNNER_TEMP/v20-history-diagnosis.log"
      - name: Publish diagnosis to temporary PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### V2.0 history regression diagnosis'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/v20-history-diagnosis/v20_history_diagnosis.json"
            echo '```'
          } > "$RUNNER_TEMP/pr-comment.md"
          python - <<'PY'
          from pathlib import Path
          p=Path('${{ runner.temp }}/pr-comment.md')
          text=p.read_text()
          if len(text)>60000:
              text=text[:59000]+'\n```\n\n[truncated]'
              p.write_text(text)
          PY
          gh pr comment 5 --repo mumaren2023/202510mumaren --body-file "$RUNNER_TEMP/pr-comment.md"
      - name: Upload diagnosis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step13-v20-history-diagnosis
          path: |
            ${{ runner.temp }}/v20-history-diagnosis/**
            ${{ runner.temp }}/v20-history-diagnosis.log
          if-no-files-found: error
          retention-days: 3
