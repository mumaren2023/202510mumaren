name: temp-step13-v21-independent
on:
  push:
    branches:
      - temp-step13-v21-independent-20260722
  pull_request:
    branches:
      - main
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download source immediately
        env:
          SOURCE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-bfe4-8206-95c2-b9aa463e7780/raw?se=2026-07-22T13:25:28Z&sp=r&sv=2026-02-06&sr=b&scid=d0222e2c-c136-5bd0-b346-cfdadfc57f30&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-21T23:52:38Z&ske=2026-07-23T23:52:38Z&sks=b&skv=2026-02-06&sig=%2BkUx0Q1BK2xQ%2BuKrBhiqCXjj3ZjHvkVNDX/6mVldDdM%3D"
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" --output "$RUNNER_TEMP/step13-v21-source.zip"
          test -s "$RUNNER_TEMP/step13-v21-source.zip"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: pip install -q jsonschema
      - name: Diagnose V2.0 history regression
        run: |
          python tools/temp_step13_v20_history_diagnose.py \
            --source-zip "$RUNNER_TEMP/step13-v21-source.zip" \
            --output "$RUNNER_TEMP/v20-history-diagnosis" \
            > "$RUNNER_TEMP/v20-history-diagnosis.log" 2>&1
      - name: Publish concise diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'v20-history-diagnosis'/'v20_history_diagnosis.json'
          data=json.loads(src.read_text())
          failures=data.get('failures',[])
          lines=['### V2.0 concise failure diagnosis','',f"validator returncode: `{data.get('returncode')}`",'',f"failure entries: `{len(failures)}`",'']
          for i,f in enumerate(failures[:12],1):
              value=f.get('value',{})
              lines += [f"#### {i}. `{f.get('path')}`",'```json',json.dumps(value,ensure_ascii=False,indent=2)[:6000],'```','']
          Path(os.environ['RUNNER_TEMP'],'concise-comment.md').write_text('\n'.join(lines))
          PY
          gh pr comment 5 --repo mumaren2023/202510mumaren --body-file "$RUNNER_TEMP/concise-comment.md"
      - name: Upload diagnosis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step13-v20-history-diagnosis
          path: |
            ${{ runner.temp }}/v20-history-diagnosis/**
            ${{ runner.temp }}/v20-history-diagnosis.log
          if-no-files-found: error
          retention-days: 3
