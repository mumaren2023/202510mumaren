name: temp-step13-v21-independent
on:
  push:
    branches:
      - temp-step13-v21-independent-20260722
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  blank:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate true blank DOCX
        run: |
          pip install -q python-docx
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          out=Path('${{ runner.temp }}')/'空白页.docx'
          doc=Document()
          doc.save(out)
          print(out, out.stat().st_size)
          PY
      - name: Upload blank DOCX
        uses: actions/upload-artifact@v4
        with:
          name: true-blank-docx
          path: ${{ runner.temp }}/空白页.docx
          if-no-files-found: error
          retention-days: 1
