name: temp-step13-v21-independent
on:
  push:
    branches:
      - temp-step13-v21-independent-20260722
  pull_request:
    branches:
      - main
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download source immediately
        env:
          SOURCE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-2cac-8206-9226-f09c3dad2d28/raw?se=2026-07-22T13:41:26Z&sp=r&sv=2026-02-06&sr=b&scid=12a2a501-646c-5d53-8e32-5a738771215c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-22T00:55:28Z&ske=2026-07-24T00:55:28Z&sks=b&skv=2026-02-06&sig=gwoHmRjrL%2BOxU0AbckIMFH4QNkFG2rqmyFnQ6rNsYO4%3D"
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" --output "$RUNNER_TEMP/step13-v21-source.zip"
          test -s "$RUNNER_TEMP/step13-v21-source.zip"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal audit dependencies
        run: pip install -q jsonschema python-docx openpyxl
      - name: Apply report serialization fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/temp_step13_v21_independent_run.py')
          text=p.read_text()
          old="    reports = audit_module.create_reports(out, audit, tests, findings)"
          new="""    report_audit = dict(audit)\n    for key in ('v21_tests', 'v20_tests'):\n        value = report_audit.get(key)\n        if isinstance(value, dict):\n            report_audit[key] = f\"{value.get('passed')}/{value.get('total')}（失败{value.get('failed')}）\"\n    reports = audit_module.create_reports(out, report_audit, tests, findings)"""
          if old not in text:
              raise SystemExit('target line not found')
          p.write_text(text.replace(old,new))
          PY
      - name: Run independent acceptance
        run: |
          python tools/temp_step13_v21_independent_run.py \
            --source-zip "$RUNNER_TEMP/step13-v21-source.zip" \
            --output-dir "$RUNNER_TEMP/step13-v21-independent-output"
      - name: Publish concise final summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'step13-v21-independent-output'/'independent_audit_result.json').read_text())
          audit=result['audit']; findings=result['findings']
          lines=['### V2.1 final independent acceptance summary','',f"Conclusion: **{result['conclusion']}**",'',f"V2.1 tests: `{audit['v21_tests']}`",f"V2.0 rollback tests: `{audit['v20_tests']}`",f"Independent boundary tests: `{audit['independent_tests']}`",f"Complete SHA match: `{audit['complete_sha_match']}`",f"Manifest errors: `{audit['manifest_errors']}`",f"History compare: `{audit['history_compare']}`",'',f"Findings: `{len(findings)}`",'']
          for i,f in enumerate(findings,1):
              lines += [f"#### {i}. {f['issue_id']} / {f['priority']}",f"**{f['title']}**",'',f"Evidence: {f['evidence']}",'',f"Impact: {f['impact']}",'',f"Repair: {f['repair']}",'']
          Path(os.environ['RUNNER_TEMP'],'final-summary.md').write_text('\n'.join(lines))
          PY
          gh pr comment 5 --repo mumaren2023/202510mumaren --body-file "$RUNNER_TEMP/final-summary.md"
