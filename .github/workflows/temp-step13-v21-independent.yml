name: temp-step13-v21-independent
on:
  push:
    branches:
      - temp-step13-v21-independent-20260722
  pull_request:
    branches:
      - main
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download source immediately
        env:
          SOURCE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-49c4-8206-9c5f-e7e733180d38/raw?se=2026-07-22T13:29:15Z&sp=r&sv=2026-02-06&sr=b&scid=25cc6d77-681b-59dc-a372-54c9828a04b0&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-21T22:38:23Z&ske=2026-07-23T22:38:23Z&sks=b&skv=2026-02-06&sig=PaQNpvtuRp1sZI4RsvszksAxHsuqQmcYsD7HL0L4MwA%3D"
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" --output "$RUNNER_TEMP/step13-v21-source.zip"
          test -s "$RUNNER_TEMP/step13-v21-source.zip"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: pip install -q jsonschema
      - name: Diagnose V2.0 history regression
        run: |
          python tools/temp_step13_v20_history_diagnose.py \
            --source-zip "$RUNNER_TEMP/step13-v21-source.zip" \
            --output "$RUNNER_TEMP/v20-history-diagnosis" \
            > "$RUNNER_TEMP/v20-history-diagnosis.log" 2>&1
      - name: Publish leaf failures only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'v20-history-diagnosis'/'v20_history_diagnosis.json').read_text())
          leaf=[]
          for f in data.get('failures',[]):
              v=f.get('value',{})
              if any(k in v for k in ('case','case_id','test')):
                  leaf.append({'path':f.get('path'),'value':v})
          lines=['### V2.0 exact leaf failures','',f"validator returncode: `{data.get('returncode')}`",'',f"leaf failures: `{len(leaf)}`",'']
          for i,item in enumerate(leaf,1):
              lines += [f"#### {i}. `{item['path']}`",'```json',json.dumps(item['value'],ensure_ascii=False,indent=2),'```','']
          Path(os.environ['RUNNER_TEMP'],'leaf-comment.md').write_text('\n'.join(lines))
          PY
          gh pr comment 5 --repo mumaren2023/202510mumaren --body-file "$RUNNER_TEMP/leaf-comment.md"
      - name: Upload diagnosis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step13-v20-history-diagnosis
          path: |
            ${{ runner.temp }}/v20-history-diagnosis/**
            ${{ runner.temp }}/v20-history-diagnosis.log
          if-no-files-found: error
          retention-days: 3
