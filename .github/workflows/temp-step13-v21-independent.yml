name: temp-step13-v21-independent
on:
  push:
    branches:
      - temp-step13-v21-independent-20260722
  pull_request:
    branches:
      - main
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download final audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/final-artifact"
          gh run download 29924456427 --repo mumaren2023/202510mumaren --name step13-v21-independent-audit-final --dir "$RUNNER_TEMP/final-artifact"
      - name: Publish artifact manifest and visual QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'final-artifact'
          files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files.append({'path':p.relative_to(root).as_posix(),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          results=list(root.rglob('independent_audit_result.json'))
          qa_files=list(root.rglob('独立验收_DOCX渲染检查_V2.2.json'))
          result=json.loads(results[0].read_text()) if results else {}
          qa=json.loads(qa_files[0].read_text()) if qa_files else {}
          lines=['### Final independent audit artifact manifest','',f"Conclusion: **{result.get('conclusion')}**",'',f"Visual QA: `{json.dumps(qa,ensure_ascii=False)}`",'',f"Files: `{len(files)}`",'']
          for item in files:
              lines.append(f"- `{item['sha256']}`  `{item['path']}`  ({item['size']} bytes)")
          Path(os.environ['RUNNER_TEMP'],'manifest-comment.md').write_text('\n'.join(lines))
          PY
          gh pr comment 5 --repo mumaren2023/202510mumaren --body-file "$RUNNER_TEMP/manifest-comment.md"
